# Mosquitto broker config for the Medi-Kiosk live sensor feed.
#
# Install on the Raspberry Pi:
#   sudo apt install -y mosquitto mosquitto-clients
#   sudo cp backend/mosquitto/medikiosk.conf /etc/mosquitto/conf.d/medikiosk.conf
#   sudo systemctl restart mosquitto
#
# Port 1883 = normal MQTT (used by tof_mqtt_publisher.py)
# Port 9001 = MQTT over WebSockets (browsers can't speak raw MQTT, so the
#             React frontend connects here: ws://<pi-ip>:9001)
#
# allow_anonymous is fine on a closed kiosk LAN for the capstone demo.
# Add a password_file before putting this on a shared network.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
